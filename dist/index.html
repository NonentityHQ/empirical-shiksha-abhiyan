मारी पहलों, अभियानों और सामुदायिक गतिविधियों के वास्तविक पल।","Real stories, ground activities, and impact from our work — watch, follow, and be a part of the change.":"हमारी सच्ची कहानियाँ, ज़मीनी गतिविधियाँ और उनके परिणाम देखें। हमसे जुड़ें और बदलाव का हिस्सा बनें।",Instagram:"इंस्टाग्राम",Reels:"रील्स","Short stories, field updates and real moments from our initiatives.":"हमारी पहलों की छोटी कहानियाँ, कार्यक्षेत्र की जानकारी और वास्तविक अनुभव।","Follow Us on Instagram":"इंस्टाग्राम पर हमसे जुड़ें",YouTube:"यूट्यूब","Detailed stories, event highlights, awareness sessions and the larger impact of our work.":"विस्तृत कहानियाँ, कार्यक्रमों की झलकियाँ, जागरूकता सत्र और हमारे कार्यों का व्यापक प्रभाव देखें।","Subscribe on YouTube":"यूट्यूब पर सदस्यता लें","Previous reels":"पिछली रील्स","Next reels":"अगली रील्स","Previous videos":"पिछले वीडियो","Next videos":"अगले वीडियो","Education work begins":"शिक्षा का सफ़र शुरू","After the lockdown, our founders began teaching a small group of students in Khandwa, laying the foundation of the Eklavya Batch.":"लॉकडाउन के बाद हमारे संस्थापकों ने खंडवा में कुछ विद्यार्थियों को पढ़ाना शुरू किया। इसी पहल से एकलव्य बैच की नींव पड़ी।","Learning Group":"अध्ययन समूह","Education + Cleanliness":"शिक्षा और स्वच्छता","On Gandhi Jayanti, we expanded our mission by combining education with cleanliness drives across Khandwa, starting at Rameshwar Kund.":"गांधी जयंती पर रामेश्वर कुंड से शुरुआत करते हुए हमने शिक्षा के साथ खंडवा में स्वच्छता अभियानों को भी अपने कार्य का हिस्सा बनाया।","Empirical Shiksha Abhiyan Samiti was officially registered, giving our work a formal identity and strengthening our commitment to education and community.":"इंपीरिकल शिक्षा अभियान समिति का आधिकारिक पंजीकरण हुआ। इससे हमारे कार्यों को औपचारिक पहचान मिली और शिक्षा व समुदाय के प्रति हमारी प्रतिबद्धता मजबूत हुई।","Focus Areas":"प्रमुख कार्यक्षेत्र","Active Volunteers":"सक्रिय स्वयंसेवक","Drives & Events":"अभियान और कार्यक्रम","Our Journey":"हमारा सफ़र","From one batch to":"एक बैच से शुरू होकर","a movement":"एक जन-अभियान तक","A short history — and the impact we’ve created so far.":"हमारे सफ़र की संक्षिप्त कहानी और अब तक हुए बदलाव की झलक।","Education • Cleanliness • Environment • Mental Health":"शिक्षा • स्वच्छता • पर्यावरण • मानसिक स्वास्थ्य","Shiksha Abhiyan":"शिक्षा अभियान","Our aim is to build a better society for every child, every family and every community in Khandwa — through education, cleanliness, environment and health awareness.":"हमारा उद्देश्य शिक्षा, स्वच्छता, पर्यावरण संरक्षण और स्वास्थ्य-जागरूकता के माध्यम से खंडवा के हर बच्चे, परिवार और समुदाय के लिए बेहतर समाज बनाना है।","Learning support for every child":"हर बच्चे के लिए सीखने का अवसर","Cleaner shared spaces":"स्वच्छ सार्वजनिक स्थल","Protecting our surroundings":"अपने पर्यावरण की रक्षा","Healthier, confident minds":"स्वस्थ और आत्मविश्वासी मन","See Our Impact":"हमारे कार्यों का प्रभाव देखें","About Us":"हमारे बारे में","Learning today, for a":"आज की शिक्षा,","stronger tomorrow.":"कल का बेहतर भविष्य।","We are a community-driven initiative in Khandwa working where education, cleanliness, environment and health meet. Founded by Rahul Geete and Jayram Malakar and powered by":"हम खंडवा में समुदाय के साथ मिलकर शिक्षा, स्वच्छता, पर्यावरण और स्वास्थ्य के क्षेत्र में काम करने वाली एक जन-पहल हैं। राहुल गीते और जयराम मलाकर द्वारा शुरू की गई इस पहल में","volunteers, we learn together and serve together.":"से अधिक स्वयंसेवक जुड़े हैं। हम साथ सीखते हैं और मिलकर समाज की सेवा करते हैं।","Know More About Us":"हमारे बारे में और जानें","Our Vision":"हमारी परिकल्पना","An educated, healthy and clean Khandwa.":"शिक्षित, स्वस्थ और स्वच्छ खंडवा।","Empower students, care for our environment, serve the community.":"विद्यार्थियों को सशक्त बनाना, पर्यावरण की देखभाल करना और समुदाय की सेवा करना।","Our Values":"हमारे मूल्य","Education. Service. Community. Integrity.":"शिक्षा। सेवा। समुदाय। ईमानदारी।","Our Four Pillars":"हमारे चार प्रमुख क्षेत्र","Four areas.":"चार क्षेत्र,","One community.":"एक समुदाय।","Every activity we run belongs to one of four areas — each one grows out of the same idea: education that turns into service.":"हमारी हर गतिविधि इन चार क्षेत्रों में से किसी एक से जुड़ी है। इन सभी का उद्देश्य एक ही है—शिक्षा को सेवा में बदलना।","All initiatives":"सभी पहलें","Learn more":"और जानें","Featured Gallery":"खास झलकियाँ","Real people. Real impact. Stories from the field.":"असली लोग, वास्तविक बदलाव और हमारे कार्यक्षेत्र की सच्ची कहानियाँ।","View All Gallery":"पूरी गैलरी देखें","Rameshwar Kund":"रामेश्वर कुंड","Join Hands":"हमारे साथ जुड़ें","Have an idea for Khandwa?":"खंडवा के लिए आपके पास कोई विचार है?","Students and community members can share ideas for education, cleanliness, environment or mental health — or simply join the next drive.":"विद्यार्थी और समुदाय के सदस्य शिक्षा, स्वच्छता, पर्यावरण या मानसिक स्वास्थ्य से जुड़े सुझाव साझा कर सकते हैं—या हमारे अगले अभियान में भाग ले सकते हैं।","Share an Idea":"अपना सुझाव दें","Volunteer With Us":"हमारे साथ स्वयंसेवा करें","Chapter 1: The Question":"अध्याय 1: एक सवाल","Can we build a society that puts collective good above personal interest?":"क्या हम ऐसा समाज बना सकते हैं, जहाँ व्यक्तिगत हित से ऊपर सामूहिक भलाई को रखा जाए?","We did not just think about the answer… we began living it.":"हमने केवल इसका उत्तर सोचने की कोशिश नहीं की… हमने उस विचार को अपने जीवन में उतारना शुरू किया।",Scroll:"आगे बढ़ें","Chapter 2: The People Behind the Idea":"अध्याय 2: इस विचार के पीछे के लोग","Why should someone limit their knowledge and skills to their own career?":"कोई व्यक्ति अपने ज्ञान और कौशल को केवल अपने करियर तक ही सीमित क्यों रखे?","Rahul Geete, Founder":"राहुल गीते, संस्थापक","Jayram Malakar, Founder and Institute Director":"जयराम मलाकर, सह-संस्थापक एवं संस्थान निदेशक","Rahul Geete":"राहुल गीते","Jayram Malakar":"जयराम मलाकर",Founder:"संस्थापक","Founder & Institute Director":"सह-संस्थापक एवं संस्थान निदेशक","Institute Director":"संस्थान निदेशक","Two different paths. One shared question.":"दो अलग-अलग रास्ते। लेकिन सवाल एक ही।","On one side was deep engineering knowledge, technical expertise and teaching experience. On the other were students in Khandwa who needed guidance and academic support.":"एक ओर गहन इंजीनियरिंग ज्ञान, तकनीकी विशेषज्ञता और अध्यापन का अनुभव था। दूसरी ओर खंडवा के वे विद्यार्थी थे, जिन्हें मार्गदर्शन और पढ़ाई में सहयोग की आवश्यकता थी।","Knowledge is more than a way to build a career. Used well, it can also make a meaningful difference in someone else’s life.":"ज्ञान केवल करियर बनाने का माध्यम नहीं है। सही दिशा में उपयोग किया जाए, तो यह किसी दूसरे के जीवन में भी सार्थक बदलाव ला सकता है।","From planning to action.":"योजना से कार्य तक।","Chapter 5: A Bigger Question":"अध्याय 5: एक बड़ा सवाल","When someone has so much knowledge, skill and experience, why devote time to community service?":"जब किसी के पास इतना ज्ञान, कौशल और अनुभव हो, तो वह अपना समय सामुदायिक सेवा में क्यों लगाए?","Perhaps because success is not only about what we build for ourselves. It is also about what we can change for the people around us.":"शायद इसलिए कि सफलता केवल अपने लिए कुछ बनाने में नहीं है। सफलता इस बात में भी है कि हम अपने आसपास के लोगों के जीवन में क्या बेहतर बदलाव ला सकते हैं।","Chapter 6: The Beginning":"अध्याय 6: शुरुआत","Every meaningful change begins with a small step.":"हर सार्थक बदलाव की शुरुआत एक छोटे कदम से होती है।","After the lockdown":"लॉकडाउन के बाद","After the 2021 lockdown, a small educational initiative began with a few students in Khandwa. This became the foundation of the Eklavya Batch.":"2021 के लॉकडाउन के बाद खंडवा में कुछ विद्यार्थियों के साथ एक छोटी शैक्षणिक पहल शुरू हुई। आगे चलकर यही पहल एकलव्य बैच की नींव बनी।","Eklavya Batch":"एकलव्य बैच","Free, regular academic support":"नियमित और निःशुल्क शैक्षणिक सहायता","Chapter 7: From Education to a Movement":"अध्याय 7: शिक्षा से जन-अभियान तक","Gandhi Jayanti":"गांधी जयंती","The work moved beyond the classroom. Students and volunteers came together to clean Rameshwar Kund — and kept coming back.":"काम कक्षा की सीमाओं स
